name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'screenshots/**'
      - 'README.md'

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-browsers-${{ matrix.theme }}

      - run: pip install -r requirements.txt
      - run: shot-scraper install

      - name: Wait for live site (Netlify)
        env:
          BASE: https://astro-resume.netlify.app
        run: |
          set -e
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/")
            if [ "$code" = "200" ]; then
              echo "site up (attempt $i)"
              sleep 20
              exit 0
            fi
            echo "waiting ($i) status=$code"
            sleep 15
          done
          exit 1

      - name: Take ${{ matrix.theme }} screenshots
        run: shot-scraper multi shots-${{ matrix.theme }}.yml --color-scheme ${{ matrix.theme }}

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.theme }}
          path: screenshots/*-${{ matrix.theme }}.png
          if-no-files-found: error

  commit:
    needs: capture
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: screenshots-*
          merge-multiple: true

      - name: Install downloaded screenshots
        run: |
          mkdir -p screenshots
          cp -f artifacts/*.png screenshots/ || cp -f artifacts/**/*.png screenshots/
          ls -la screenshots/

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "chore: refresh README screenshots [skip ci]"
          git push
